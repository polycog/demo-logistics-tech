[project]
name = "demo-logistics-tech"
version = "0.1.0"
description = "A pricing support agent for a small logistics network, built with polycog cognition"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "polycog-cognition>=1.0.2",
    "pydantic-ai-slim[openai]",
]

[dependency-groups]
dev = [
    "pytest>=9",
]

[tool.uv]
# a demo of flat modules, not a library: uv installs the dependencies without building this project
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
