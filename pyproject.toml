[project]
name = "demo-logistics-tech"
version = "0.1.0"
description = "A pricing support agent for a small logistics network, built with polycog cognition"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "polycog-cognition>=1.0.2",
    "pydantic-ai-slim[openai]",
]

[project.scripts]
logistics-agent = "logistics_agent.assistant:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9",
]

[tool.uv.build-backend]
module-name = "logistics_agent"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
